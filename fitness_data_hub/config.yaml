name: Fitness Data Hub
version: "0.1.0"
slug: fitness_data_hub
description: Provider-independent fitness data hub with sync, stats and insights
url: "https://github.com/Alessandro1981/hassio-addons"
icon: icon.png
logo: logo.png
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
panel_icon: mdi:chart-timeline-variant
panel_title: Fitness Data Hub
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Fitness Data Hub web interface
webui: "http://[HOST]:[PORT:8100]/"
options:
  provider: "strava"
  app_base_url: ""
  strava_client_id: ""
  strava_client_secret: ""
  strava_scopes: "read,activity:read_all,profile:read_all"
  sync_enabled: true
  sync_interval_seconds: 3600
schema:
  provider: list(strava)
  app_base_url: str
  strava_client_id: str
  strava_client_secret: password
  strava_scopes: str
  sync_enabled: bool
  sync_interval_seconds: int
